<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1c21"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="silver" x1="14" y1="17" x2="36" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="cyan" x1="32" y1="21" x2="50" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Subtle 3x3 Mesh Dot Matrix (inspired by Tailnet topology) -->
  <g fill="#ffffff" fill-opacity="0.11">
    <circle cx="15" cy="15" r="2.2"/>
    <circle cx="32" cy="15" r="2.2"/>
    <circle cx="49" cy="15" r="2.2"/>
    <circle cx="15" cy="32" r="2.2"/>
    <circle cx="32" cy="32" r="2.2"/>
    <circle cx="49" cy="32" r="2.2"/>
    <circle cx="15" cy="49" r="2.2"/>
    <circle cx="32" cy="49" r="2.2"/>
    <circle cx="49" cy="49" r="2.2"/>
  </g>

  <!-- Back Layer: T + E Monogram (Brushed Platinum) -->
  <path d="M14.5 17H36M22 17V47M22 32H31M22 47H33" stroke="url(#silver)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knockout gap for luxury interlocking depth -->
  <path d="M32 21.5V47M32 21.5H42C46.2 21.5 49.5 24.3 49.5 28C49.5 31.7 46.2 34.5 42 34.5H32M40 34.5L49.5 47" stroke="#0d0d10" stroke-width="8.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Layer: P + R Monogram (Electric Cyan) -->
  <path d="M32 21.5V47M32 21.5H42C46.2 21.5 49.5 24.3 49.5 28C49.5 31.7 46.2 34.5 42 34.5H32M40 34.5L49.5 47" stroke="url(#cyan)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
